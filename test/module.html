		perception: { asked: 0, visionAsked: 0, pending: {}, update(flags) { Object.assign(this.pending, flags); },
			apply() {
				const flags = this.pending;
				this.pending = {};
				if (flags.refreshLighting) { this.asked++; refreshLighting(); }
				if (flags.refreshVision) { this.visionAsked++; refreshVision(); }
			} } };
	app.ticker.add(() => canvas.perception.apply(), null, PIXI.UPDATE_PRIORITY.NORMAL + 2);
	game.canvas = canvas;
	const quadtree = new CanvasQuadtree();
	canvas.walls.quadtree = quadtree;
	const insert = (wall) => { quadtree.update({ r: wall.bounds, t: wall }); return wall; };
	const wallList = [...unique.values()].map((c) => insert(makeWall(c)));
	canvas.walls.placeables = wallList;
	wallList.forEach((wall, number) => { wall.document.id = 'wall' + number; });

	// the classes Foundry makes canvas.effects and canvas.visibility of, where a wrapper goes
	CONFIG.Canvas.groups = { effects: { groupClass: Effects }, visibility: { groupClass: Visibility } };
	await import(`${moduleRoot}/scripts/main.mjs`);
	Hooks.callAll('init');
	Hooks.callAll('setup');
	const { layerClass, group } = CONFIG.Canvas.layers.coverView;
	const layer = new layerClass();
	canvas.coverView = layer;
	stage.addChild(layer);
	const controls = layerClass.prepareSceneControls();
	report.control = { name: controls.name, layerName: layerClass.layerOptions.name, group, activeTool: controls.activeTool,
		tools: Object.values(controls.tools).map((t) => `${t.order}:${t.name}${t.toggle ? '(toggle ' + t.active + ')' : ''}${t.button ? '(button)' : ''}`) };
	for (const t of Object.values(controls.tools)) localize(t.title);
	localize(controls.title);
	await layer.draw();
	for (let i = 0; i < 100 && !canvas.coverView.children[6]; i++) await sleep(50);
	await sleep(1500);

	const event = (origin, destination) => ({ interactionData: { origin, destination: destination ?? origin } });
	// a real mouse event on the canvas element, at a place of the scene
	const mouse = (type, x, y, button = 0) => {
		const box = app.view.getBoundingClientRect();
		const init = { bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true, button, buttons: type === 'pointerup' ? 0 : (button === 2 ? 2 : 1),
			clientX: box.left + x * SCALE * (box.width / app.screen.width), clientY: box.top + y * SCALE * (box.height / app.screen.height) };
		app.view.dispatchEvent(new PointerEvent(type, init));
	};
	const frame = () => sleep(60);
	// the address the module loaded the library by, so that it is the same instance
	const libraryAddress = () => performance.getEntriesByType('resource').map((entry) => entry.name).filter((name) => name.includes(`${moduleRoot}/lib/test_local_gpu_api.js`)).pop() ?? `${moduleRoot}/lib/test_local_gpu_api.js`;
	window.h = {
		layer, controls, quadtree, insert, makeWall, sleep, notes, missing, stored, unique, tokens, makeToken, drawTokens, mouse, frame,
		surfaces, makeSurface, sceneDocument,
		// what Wall Height's fields in the sheet of a wall set (in the scene's units), and the hook
		setHeights: async (wall, bottom, top) => {
			wall.document.flags['wall-height'] = { ...(bottom === null ? {} : { bottom }), ...(top === null ? {} : { top }) };
			Hooks.callAll('updateWall');
			await sleep(350);
		},
		// what Foundry's hooks would tell the layer about regions
		regionsChanged: async () => { Hooks.callAll('updateRegion'); await sleep(350); },
		marks: () => layer.children[5].children.map((m) => m.thing.kind + (m.thing.end ?? '') + (m.thing.ray ? m.thing.ray.number : '')),
		// what Foundry's hooks would tell the layer about the tokens
		select: async (token) => { tokens.controlled = token ? [token] : []; drawTokens(); Hooks.callAll('controlToken'); await frame(); },
		moveToken: async (token, x, y) => { token.x = x; token.y = y; drawTokens(); Hooks.callAll('refreshToken'); await frame(); },
		// a drag with the real mouse: down on one place, moves, up on another
		mouseDrag: async (from, to, steps = 8) => {
			mouse('pointerdown', from.x, from.y);
			const times = [];
			for (let i = 1; i <= steps; i++) {
				const t0 = performance.now();
				mouse('pointermove', from.x + (to.x - from.x) * i / steps, from.y + (to.y - from.y) * i / steps);
				times.push(performance.now() - t0);
			}
			mouse('pointerup', to.x, to.y);
			return (times.reduce((a, b) => a + b, 0) / times.length).toFixed(1) + ' ms per move';
		},
		setAnswer: (v) => { dialogAnswer = v; },
		wallList, lightSources, makeLight, strings,
		// what Foundry's hooks would tell the layer about walls and lighting
		wallsChanged: async () => { Hooks.callAll('updateWall'); await sleep(350); },
		lightingChanged: async () => { refreshLighting(); await frame(); },
		refreshLighting, colors, visionLight, Effects, visionSight, visionSources, VisionSource, refreshVision, Visibility,
		// a token that sees: Foundry's vision source for it, set up and counted among the canvas's
		seeing: (token, radius) => {
			token.document.detectionModes = { basicSight: { enabled: true, range: radius }, lightPerception: { enabled: true, range: Infinity } };
			const source = token.vision ?? new VisionSource({ sourceId: 'Token.' + token.id, object: token });
			token.vision = source;
			const centre = token.center;
			source.initialize({ x: centre.x, y: centre.y, radius, visionMode: token.visionMode ?? 'basic' });
			source.add();
			// as Foundry after a token's view has changed: lighting and vision are drawn anew on the next frame
			canvas.perception.update({ refreshVision: true, refreshLighting: true });
			return source;
		},
		// the vision sources Foundry draws the effects of a vision mode for, as it would in refreshLighting
		visionEffects: () => visionSources.filter((s) => s.active && s.radius > 0).map((s) => `${s.mirrored ? 'mirror' : 'token'} ${s.data.visionMode} ${s.radius}`),
		// what is in Foundry's three layers of light right now
		lighting: () => ({ illumination: lightMeshes.children.map((c) => (c instanceof PIXI.Sprite ? 'picture' : 'mesh')).join(), coloration: coloration.children.length, background: backgroundLighting.children.length }),
		picture: () => lightMeshes.children.find((c) => c instanceof PIXI.Sprite) ?? null,
		// the sheet of a wall as Foundry draws it, as far as the module looks at it, and the hook
		wallSheet: (wall) => {
			const element = document.createElement('form');
			element.innerHTML = '<section class="window-content"><div class="standard-form scrollable"><p class="hint">instructions</p><fieldset><legend>Restrictions</legend></fieldset><fieldset><legend>Door</legend></fieldset></div><footer class="form-footer"></footer></section>';
			Hooks.callAll('renderWallConfig', { id: 'WallConfig-test', document: wall.document }, element);
			return element;
		},
		// the wall nearest to a place
		wallNear: (x, y) => wallList.reduce((best, w) => {
			const [x0, y0, x1, y1] = w.document.c;
			const d = Math.hypot((x0 + x1) / 2 - x, (y0 + y1) / 2 - y);
			return !best || d < best.d ? { w, d } : best;
		}, null).w,
		// the color of the harness canvas at a place of the scene, after it has been drawn
		pixel: (x, y) => {
			app.render();
			const copy = document.createElement('canvas');
			copy.width = app.view.width;
			copy.height = app.view.height;
			const context = copy.getContext('2d');
			context.drawImage(app.view, 0, 0);
			const k = app.view.width / app.screen.width;
			return [...context.getImageData(Math.round(x * SCALE * k), Math.round(y * SCALE * k), 1, 1).data].slice(0, 3);
		},
		// the script's own picture at a place of the scene
		lightAt: async (x, y) => {
			const { cover } = await import(libraryAddress());
			const copy = document.createElement('canvas');
			copy.width = cover.canvas.width;
			copy.height = cover.canvas.height;
			const context = copy.getContext('2d');
			context.drawImage(cover.canvas, 0, 0);
			return [...context.getImageData(Math.round(x / 6000 * copy.width), Math.round(y / 4600 * copy.height), 1, 1).data].slice(0, 3);
		},
		labels: () => layer.children[6].children.map((t) => t.text),
		tool: (name) => { game.activeTool = name; },
		toggle: (name, on) => controls.tools[name].onChange(null, on),
		click: (x, y) => layer._onClickLeft(event({ x, y })),
		rightClick: (x, y) => layer._onClickRight(event({ x, y })),
		// Foundry sends the click on the way down, then the drag
		drag: (from, to, steps = 12) => {
			layer._onClickLeft(event(from));
			layer._onDragLeftStart(event(from));
			const times = [];
			for (let i = 1; i <= steps; i++) {
				const t0 = performance.now();
				layer._onDragLeftMove(event(from, { x: from.x + (to.x - from.x) * i / steps, y: from.y + (to.y - from.y) * i / steps }));
				times.push(performance.now() - t0);
			}
			layer._onDragLeftDrop(event(from, to));
			return (times.reduce((a, b) => a + b, 0) / times.length).toFixed(1) + ' ms per move';
		},
		geometry: () => Object.fromEntries(['cells', 'walls', 'cover', 'rays'].map((name, i) => {
			const child = layer.children[i];
			return [name, child.geometry ? child.geometry.graphicsData.length : (child.visible ? `${Math.round(child.width)}x${Math.round(child.height)} at ${child.x},${child.y}, texture ${child.texture.baseTexture.realWidth}x${child.texture.baseTexture.realHeight}` : 'hidden')];
		})),
	};
	report.ready = { labels: h.labels(), geometry: h.geometry(), notes };
} catch (error) {
	report.failed = String(error && error.stack ? error.stack : error);
}
out.textContent = JSON.stringify(report, null, 1);
window.done = true;
</script>
